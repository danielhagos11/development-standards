
name: BL .NET Development Standards

on:
  workflow_call:
    inputs:
      validation-mode:
        description: "Validation mode: warn or enforce"
        required: false
        type: string
        default: warn

permissions:
  contents: read
  pull-requests: read

jobs:
  development-standards:
    name: Validate BL Development Standards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect .NET repository
        id: detect
        shell: bash
        run: |
          if git ls-files | grep -Eiq '\.(csproj|sln|slnx)$'; then
            echo "is_dotnet=true" >> "$GITHUB_OUTPUT"
            echo "A .NET project or solution was detected."
          else
            echo "is_dotnet=false" >> "$GITHUB_OUTPUT"
            echo "No .NET project or solution was detected."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.is_dotnet == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      
      - name: Checkout BL development standards
        if: steps.detect.outputs.is_dotnet == 'true'
        uses: actions/checkout@v4
        with:
          repository: danielhagos11/development-standards
          ref: v1
          path: bl-development-standards

      - name: Run BL development standards validator
        if: steps.detect.outputs.is_dotnet == 'true'
        env:
          VALIDATION_MODE: ${{ inputs.validation-mode }}
        run: node development-standards/scripts/validate-standards.js

